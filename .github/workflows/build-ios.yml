# 仅响应 Flutter 专用 tag：flutter-v*（例如 flutter-v1.0.0）
# 不要使用裸 v* —— 那是 Kotlin 版（re_build）的 tag 前缀，会互相踩踏。
name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'flutter-v*'

# 默认 GITHUB_TOKEN 无 contents:write 时无法创建 Release（会 403）
permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout flutter branch / tag
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          VERSION="${GITHUB_REF_NAME#flutter-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="manual"
          fi
          OUT_NAME="CopyManga-flutter-${VERSION}-unsigned.ipa"
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/
          cd build/output
          zip -r "$OUT_NAME" Payload
          ls -lh "$OUT_NAME"
          echo "OUT_NAME=$OUT_NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyManga-unsigned-ipa
          path: build/output/*.ipa

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/flutter-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 不改 title/body：首次简介由本地 gh release create 写好，此处只上传/覆盖 IPA
          files: build/output/*.ipa
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
